# Odoo 17 + Postgres with demo data (crm, sales, contacts). Demo data only; no real client data.
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      retries: 10

  # The LangGraph agent behind a small HTTP API; the Odoo chat addon calls it server-side.
  agent:
    build: .
    env_file: .env
    environment:
      ODOO_URL: http://odoo:8069   # container-to-container address (overrides .env)
      ODOO_DB: odoo
    depends_on:
      - odoo
    ports:
      - "8000:8000"
    volumes:
      - agent-cache:/root/.cache   # Chroma's embedding model, downloaded once
    restart: unless-stopped

  # One-shot: creates the "odoo" database and installs modules WITH demo data, then exits.
  odoo-init:
    image: odoo:17.0
    depends_on:
      db:
        condition: service_healthy
    environment: &odoo_env
      HOST: db
      USER: odoo
      PASSWORD: odoo
    # Idempotent: full install (with demo data) only on a fresh DB. Re-running `-i base` on an
    # existing DB resets the admin user's groups, so afterwards only the addon is (re)installed.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        DB="--db_host db --db_user odoo --db_password odoo"
        if python3 -c "import psycopg2; psycopg2.connect(host='db', user='odoo', password='odoo', dbname='odoo')" 2>/dev/null; then
          odoo -d odoo $$DB -i agent_chat -u agent_chat --stop-after-init
        else
          odoo -d odoo $$DB -i base,contacts,crm,sale_management,agent_chat --stop-after-init
        fi
    volumes:
      - odoo-data:/var/lib/odoo
      - ./odoo_addons:/mnt/extra-addons:ro
    restart: "no"

  odoo:
    image: odoo:17.0
    depends_on:
      odoo-init:
        condition: service_completed_successfully
    ports:
      - "8069:8069"
    environment: *odoo_env
    command: odoo -d odoo --db-filter=^odoo$$
    volumes:
      - odoo-data:/var/lib/odoo
      - ./odoo_addons:/mnt/extra-addons:ro

volumes:
  pgdata:
  odoo-data:
  agent-cache:
